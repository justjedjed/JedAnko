<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="text-scale" content="scale" />

	<!-- SEO: page-specific title, description, canonical, and social tags
	     live in each route's <svelte:head> so crawlers see exactly one set. -->

	<meta name="author" content="Jade Jabagat Angco" />
	<meta name="robots" content="index, follow" />
	<meta name="language" content="English" />
	<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	<link rel="manifest" href="/manifest.webmanifest" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
		rel="stylesheet"
	/>
	<meta name="theme-color" content="#e60000" />

	<!-- Geo Tags — Purok 4 Dela Silva Street, Poblacion, Bislig City 8311 -->
	<meta name="geo.region" content="PH-SUR" />
	<meta name="geo.placename" content="Purok 4 Dela Silva Street, Poblacion, Bislig City, Surigao del Sur 8311, Philippines" />
	<meta name="geo.position" content="8.2146;126.3156" />
	<meta name="ICBM" content="8.2146, 126.3156" />
	<meta property="place:location:latitude" content="8.2146" />
	<meta property="place:location:longitude" content="126.3156" />

	<script>
		try {
			var saved = localStorage.getItem("theme");
			var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
			document.documentElement.setAttribute("data-theme", saved || (prefersLight ? "light" : "dark"));
		} catch (e) {
			document.documentElement.setAttribute("data-theme", "dark");
		}
	</script>

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
	<script type="text/javascript">
	    (function(c,l,a,r,i,t,y){
	        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
	        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
	        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
	    })(window, document, "clarity", "script", "ycjnunp0xk");
	</script>
</body>
</html>
